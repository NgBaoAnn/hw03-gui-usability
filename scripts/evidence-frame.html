<!doctype html>

<form aria-label="Chú thích bằng chứng kiểm thử, không phải SUT">
<div>CHÚ THÍCH BẰNG CHỨNG KIỂM THỬ - KHÔNG THAY ĐỔI CHỨC NĂNG SUT</div>
<label>Email <input readonly value="23120207@student.hcmus.edu.vn" size="35"></label>
<label>MSSV <input readonly value="23120207" size="10"></label>
<label>Họ tên <input readonly value="Nguyễn Bảo An" size="20"></label>
<div id="environment"></div><div id="target"></div></form>
<iframe title="EShop SUT" src="/"></iframe>
<script>
const target=new URLSearchParams(location.search).get('target')||'/';
if(!/^\/(?!\/)[a-zA-Z0-9/_-]*$/.test(target))throw Error('Invalid SUT path');
document.querySelector('iframe').src=target;
setInterval(()=>{
document.querySelector('#environment').textContent='macOS 26.2 | '+navigator.userAgent+' | '+new Date().toISOString();
document.querySelector('#target').textContent='SUT: '+document.querySelector('iframe').contentWindow.location.href+' | Real browser smoke check; no result inferred for unexecuted checks';
},250);
</script></html>
